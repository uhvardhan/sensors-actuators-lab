code: "25PC2RA202"
title: "Sensors and Actuators Laboratory"
programme: "B.Tech. — Computer Science and Engineering (Robotics & Artificial Intelligence)"
semester: "III Semester"
regulation: "R25"
academic_year: "2026–27"

# NOTE: the R25 curriculum table lists this lab as 25PC2RA202, while the detailed
# syllabus page is headed 25PC2RA203 (a code it shares with the Software Systems
# lab). Confirm with the department and correct `code` above if needed.

teaching_scheme:
  lecture: 0
  practical: 2
  credits: 1

timings:
  - "Batch 1 — Mondays, 10:00 AM to 12:00 PM"
  - "Batch 2 — Thursdays, 1:40 PM to 3:40 PM"
venue: "E233"

evaluation:
  - key: "D-D"
    label: "Day-to-day evaluation"
    marks: 10
  - key: "PE"
    label: "Practical examination (internal)"
    marks: 10
  - key: "LR"
    label: "Laboratory record"
    marks: 10
  - key: "CP"
    label: "Course project"
    marks: 10
  - key: "SEE"
    label: "Semester end examination"
    marks: 60

prerequisites: "Basic Electrical and Electronics Engineering. Working knowledge of Python is assumed."

objectives:
  - "Process proprioceptive and exteroceptive sensor data and analyse sensor properties."
  - "Analyse the hardware differences between rolling and global shutter camera systems."
  - "Implement computer vision algorithms for object tracking and depth estimation."
  - "Control electric actuators (DC, stepper, BLDC) and implement a closed-loop perception–action system."

outcomes:
  - id: "CO-1"
    text: "Characterize sensor noise and drift in IMUs and calibrate encoders for odometry."
  - id: "CO-2"
    text: "Deploy vision hardware configurations to mitigate motion artifacts using global shutter technology."
  - id: "CO-3"
    text: "Utilize LiDAR and depth cameras to generate environmental maps and distance data."
  - id: "CO-4"
    text: "Design an integrated robotic system that uses vision-based feedback to control servo actuated mechanisms."

