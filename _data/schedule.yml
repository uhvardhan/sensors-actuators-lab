#   dates      — list, printed one per line. Leave [] and the site prints an em dash.
#   session    — the Experiment column. Leave "" for an em dash.
#   notes      — the Notes column.
#   scripts    — the Scripts column.
#   resources  — the Additional resources column.
#
# The three link columns are each a list of {name, url}, printed one per line;
# [] prints an em dash. A url starting with "/" resolves against the site:
#
#   notes:
#     - name: "Experiment sheet (PDF)"
#       url: "/assets/files/exp-01-sheet.pdf"
#
# An external link (https://…) is used as written.

