# ─── Site identity ────────────────────────────────────────────────────────────
title: "Sensors and Actuators Laboratory"
tagline: "Fall 2026 (July – November)"
description: >-
  Course website for Sensors and Actuators Laboratory (25PC2RA202),
  B.Tech. CSE (Robotics & Artificial Intelligence), VNR VJIET.

# EDIT if you name the repository something other than sensors-actuators-lab.
url: "https://uhvardhan.github.io"
baseurl: "/sensors-actuators-lab"

# ─── Institute block (masthead + footer) ──────────────────────────────────────
institute:
  name: "VNR Vignana Jyothi Institute of Engineering and Technology"
  short: "VNR VJIET"
  url: "https://www.vnrvjiet.ac.in"
  # Official VNR VJIET emblem (vector). Natural aspect ratio is 120:81.
  logo: "/assets/images/vnrvjiet-logo.svg"
  department: "Department of Computer Science and Engineering (Robotics & Artificial Intelligence)"
  address: "Bachupally, Hyderabad, Telangana — 500090"

# ─── Collections ──────────────────────────────────────────────────────────────
collections:
  experiments:
    output: true
    permalink: /experiments/:name/

defaults:
  - scope:
      path: ""
      type: "experiments"
    values:
      layout: "experiment"

# ─── Build ────────────────────────────────────────────────────────────────────
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .jekyll-cache
